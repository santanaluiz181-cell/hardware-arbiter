<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="Hardware Arbiter Hero Banner with Pente Fino Mascot">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111726"/>
      <stop offset="100%" stop-color="#090d15"/>
    </linearGradient>

    <!-- Tortoise/Amber Shell Material for Comb Spine -->
    <linearGradient id="comb-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="35%" stop-color="#d97706"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <linearGradient id="comb-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <linearGradient id="tooth-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="40%" stop-color="#fde68a"/>
      <stop offset="75%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <radialGradient id="comb-blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#f43f5e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>

    <!-- Glows and Shadows -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.8"/>
    </filter>
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.8"/>
    </filter>

    <style>
      @keyframes floatComb {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-4px) rotate(-1deg); }
      }
      @keyframes flowCyan {
        0% { stroke-dashoffset: 160; }
        100% { stroke-dashoffset: 0; }
      }
      .comb-char {
        animation: floatComb 4.5s ease-in-out infinite;
        transform-origin: 750px 150px;
      }
      .cyan-flow {
        stroke-dasharray: 60 30;
        animation: flowCyan 2.5s linear infinite;
      }
      .mono-text {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
      }
      .sans-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Card Frame -->
  <rect x="2" y="2" width="956" height="296" rx="18" fill="url(#hb-bg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Left: Content & Badges -->
  <g transform="translate(48, 50)">
    <!-- Top Pill Badges -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="138" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="12" cy="13" r="4" fill="#38bdf8"/>
      <text x="24" y="17" class="mono-text" font-size="11" fill="#94a3b8" font-weight="600">v0.1.0 • OPEN-SOURCE</text>

      <rect x="148" y="0" width="130" height="26" rx="6" fill="#13271f" stroke="#065f46" stroke-width="1"/>
      <circle cx="160" cy="13" r="4" fill="#10b981"/>
      <text x="172" y="17" class="mono-text" font-size="11" fill="#34d399" font-weight="600">HRI: GPU_DOMINANT</text>
    </g>

    <!-- Main Headline -->
    <text x="0" y="68" class="sans-text" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.03em">
      Hardware Arbiter
    </text>

    <!-- Subtitle -->
    <text x="0" y="100" class="sans-text" font-size="15" fill="#94a3b8" font-weight="400">
      Passando o <tspan fill="#f59e0b" font-weight="600">Pente Fino</tspan> no seu PC: Cargas pesadas vão com a GPU,
    </text>
    <text x="0" y="122" class="sans-text" font-size="15" fill="#94a3b8" font-weight="400">
      a CPU fica livre de gargalos e nós de concorrência.
    </text>

    <!-- Command Snippet Box -->
    <g transform="translate(0, 145)">
      <rect x="0" y="0" width="460" height="42" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="26" class="mono-text" font-size="13" fill="#38bdf8">
        $ pip install -e . &amp;&amp; hardware-arbiter --apply
      </text>
    </g>

    <!-- Feature Pillars -->
    <g transform="translate(0, 208)">
      <text x="0" y="0" class="mono-text" font-size="11" fill="#64748b">
        <tspan fill="#38bdf8">✓</tspan> DirectML &amp; Vulkan   
        <tspan fill="#38bdf8" dx="18">✓</tspan> Thread-Clamping   
        <tspan fill="#38bdf8" dx="18">✓</tspan> EN / PT / ZH
      </text>
    </g>
  </g>

  <!-- Right: Pente Fino in Action (Hair Comb Sorting GPU vs CPU) -->
  <g class="comb-char" transform="translate(710, 140)" filter="url(#soft-shadow)">
    
    <!-- Flowing GPU Strands (Silky Cyan swept to the right) -->
    <g filter="url(#cyan-glow)">
      <path class="cyan-flow" d="M -30 70 C 20 120, 90 90, 150 110" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round"/>
      <path class="cyan-flow" d="M -10 80 C 40 135, 110 110, 180 125" fill="none" stroke="#00f2fe" stroke-width="5" stroke-linecap="round"/>
      <path class="cyan-flow" d="M 10 90 C 60 145, 130 125, 200 135" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round"/>
    </g>

    <!-- CPU Strands (Staying orderly on the bottom left) -->
    <path d="M -80 70 Q -50 90 -40 120" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-dasharray="5 3"/>
    <path d="M -90 85 Q -65 105 -55 130" fill="none" stroke="#d97706" stroke-width="3"/>

    <!-- Comb Teeth -->
    <g id="teeth-row">
      <rect x="-80" y="0" width="5.5" height="85" rx="2.5" fill="url(#tooth-grad)"/>
      <rect x="-68" y="0" width="5.5" height="87" rx="2.5" fill="url(#tooth-grad)"/>
      <rect x="-56" y="0" width="5.5" height="89" rx="2.5" fill="url(#tooth-grad)"/>
      <rect x="-44" y="0" width="5.5" height="90" rx="2.5" fill="url(#tooth-grad)"/>
      <rect x="-32" y="0" width="5.5" height="90" rx="2.5" fill="url(#tooth-grad)"/>
      <rect x="-20" y="0" width="5.5" height="90" rx="2.5" fill="url(#tooth-grad)"/>
      <rect x="-8" y="0" width="5.5" height="90" rx="2.5" fill="url(#tooth-grad)"/>
      <rect x="4" y="0" width="5.5" height="90" rx="2.5" fill="url(#tooth-grad)"/>
      <rect x="16" y="0" width="5.5" height="90" rx="2.5" fill="url(#tooth-grad)"/>
      <rect x="28" y="0" width="5.5" height="89" rx="2.5" fill="url(#tooth-grad)"/>
      <rect x="40" y="0" width="5.5" height="87" rx="2.5" fill="url(#tooth-grad)"/>
      <rect x="52" y="0" width="5.5" height="85" rx="2.5" fill="url(#tooth-grad)"/>
      
      <!-- Glowing active tips -->
      <circle cx="-5.5" cy="88" r="3.5" fill="#38bdf8" filter="url(#cyan-glow)"/>
      <circle cx="18.5" cy="88" r="3.5" fill="#38bdf8" filter="url(#cyan-glow)"/>
    </g>

    <!-- Ergonomic Comb Spine -->
    <path d="M -105 10 Q -110 -65 0 -68 Q 110 -65 105 10 Q 100 18 85 18 L -85 18 Q -100 18 -105 10 Z" 
          fill="url(#comb-body)" stroke="#78350f" stroke-width="3"/>
    <path d="M -95 4 Q -100 -56 0 -58 Q 100 -56 95 4" 
          fill="none" stroke="url(#comb-gold)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Dapper Top Hat on Comb Spine -->
    <g transform="translate(0, -68)">
      <ellipse cx="0" cy="3" rx="34" ry="7" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
      <path d="M -19 3 C -20 -15, -13 -24, 0 -22 C 13 -24, 20 -15, 19 3 Z" fill="#0f172a"/>
      <path d="M -19 1 C -13 0, 13 0, 19 1 L 18 3 C 13 2, -13 2, -18 3 Z" fill="url(#comb-gold)"/>
    </g>

    <!-- Eyes (Big, lively, with Phanty/Foquinha sparkles) -->
    <!-- Left Eye -->
    <circle cx="-32" cy="-22" r="12" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
    <circle cx="-30" cy="-23" r="7" fill="#0f172a"/>
    <circle cx="-27" cy="-26" r="2.8" fill="#ffffff"/>
    <circle cx="-33" cy="-20" r="1.4" fill="#ffffff"/>

    <!-- Right Eye with Dapper Gold Monocle -->
    <circle cx="32" cy="-22" r="12" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
    <circle cx="30" cy="-23" r="7" fill="#0f172a"/>
    <circle cx="33" cy="-26" r="2.8" fill="#ffffff"/>
    <circle cx="27" cy="-20" r="1.4" fill="#ffffff"/>
    
    <!-- Monocle Ring & Ribbon -->
    <circle cx="32" cy="-22" r="15" fill="none" stroke="url(#comb-gold)" stroke-width="2.5"/>
    <path d="M 47 -22 Q 54 -17 58 -5" fill="none" stroke="url(#comb-gold)" stroke-width="1.5"/>

    <!-- Cheerful blush and smile -->
    <ellipse cx="-47" cy="-12" rx="7" ry="4" fill="url(#comb-blush)"/>
    <ellipse cx="47" cy="-12" rx="7" ry="4" fill="url(#comb-blush)"/>
    <path d="M -9 -11 Q 0 -3 9 -11" fill="none" stroke="#451a03" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Dapper Cyan Bow Tie -->
    <g transform="translate(0, 16)">
      <polygon points="-12,-5 -12,5 0,0" fill="#38bdf8" stroke="#0284c7" stroke-width="1"/>
      <polygon points="12,-5 12,5 0,0" fill="#38bdf8" stroke="#0284c7" stroke-width="1"/>
      <circle cx="0" cy="0" r="3.5" fill="#f59e0b"/>
    </g>

    <!-- Comb Handle (Left Tail) -->
    <path d="M -102 6 C -130 2, -155 -15, -165 -40 C -168 -55, -160 -65, -148 -60 C -130 -52, -112 -25, -98 -5 Z" 
          fill="url(#comb-body)" stroke="#78350f" stroke-width="2.5"/>
  </g>
</svg>
