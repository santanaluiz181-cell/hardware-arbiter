<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="Hardware Arbiter Hero Banner with Pente Mascot">
  <defs>
    <!-- Background Frame Gradient -->
    <linearGradient id="hb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e121d"/>
      <stop offset="45%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0b0e17"/>
    </linearGradient>

    <!-- Character Ambient Aura -->
    <radialGradient id="hb-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#00f2fe" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#141824" stop-opacity="0"/>
    </radialGradient>

    <!-- Floor Drop Shadow -->
    <radialGradient id="hb-floor-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#080a10" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#080a10" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#080a10" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm Cream Face (#F0DED2) -->
    <linearGradient id="hb-cream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="65%" stop-color="#f2ded2"/>
      <stop offset="100%" stop-color="#e6cfc2"/>
    </linearGradient>

    <!-- Dark Fur Mask / Patches / Ears (#7E6C6A) -->
    <linearGradient id="hb-patch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a7977"/>
      <stop offset="50%" stop-color="#7a6866"/>
      <stop offset="100%" stop-color="#645351"/>
    </linearGradient>

    <!-- Body Fur Base -->
    <linearGradient id="hb-body-fur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6b5b5a"/>
      <stop offset="50%" stop-color="#554746"/>
      <stop offset="100%" stop-color="#3e3433"/>
    </linearGradient>

    <!-- Navy Vest (#22445D) -->
    <linearGradient id="hb-vest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b516e"/>
      <stop offset="60%" stop-color="#203d54"/>
      <stop offset="100%" stop-color="#142634"/>
    </linearGradient>

    <!-- Amber Comb (#EE992C) -->
    <linearGradient id="hb-comb-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb74d"/>
      <stop offset="35%" stop-color="#f59324"/>
      <stop offset="70%" stop-color="#df7912"/>
      <stop offset="100%" stop-color="#b85a06"/>
    </linearGradient>

    <linearGradient id="hb-comb-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="50%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Cheeks Rosy Glow -->
    <radialGradient id="hb-cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f4a2a8" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#f4a2a8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f4a2a8" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="hb-cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#00f2fe" flood-opacity="0.95"/>
      <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#0284c7" flood-opacity="0.55"/>
    </filter>

    <!-- Inline Keyframes -->
    <style>
      .char-breathe {
        animation: hbBreathe 4.2s ease-in-out infinite;
        transform-origin: 512px 435px;
      }
      @keyframes hbBreathe {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-3.5px) scale(1.012, 1.015); }
      }
      .comb-motion {
        animation: hbCombStroke 2.4s ease-in-out infinite;
        transform-origin: 550px 355px;
      }
      @keyframes hbCombStroke {
        0%, 100% { transform: translate(0px, 0px) rotate(-1.5deg); }
        25% { transform: translate(5px, -2px) rotate(0.8deg); }
        50% { transform: translate(10px, 1px) rotate(2.5deg); }
        75% { transform: translate(4px, 2px) rotate(0deg); }
      }
      .holding-hand {
        animation: hbHoldSway 4.2s ease-in-out infinite;
        transform-origin: 455px 365px;
      }
      @keyframes hbHoldSway {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-2px) rotate(1deg); }
      }
      .eye-blink {
        animation: hbBlink 4.6s ease-in-out infinite;
        transform-origin: 512px 276px;
      }
      @keyframes hbBlink {
        0%, 93%, 100% { transform: scaleY(1); }
        95.5% { transform: scaleY(0.08); }
      }
      .pupil-track {
        animation: hbPupils 7.2s ease-in-out infinite;
      }
      @keyframes hbPupils {
        0%, 25%, 100% { transform: translate(0px, 0px); }
        35%, 55% { transform: translate(-2.5px, 0.8px); }
        65%, 85% { transform: translate(2.2px, -0.8px); }
      }
      .snout-twitch {
        animation: hbSnout 3.8s ease-in-out infinite;
        transform-origin: 511px 293px;
      }
      @keyframes hbSnout {
        0%, 100% { transform: translateY(0px) scale(1); }
        45% { transform: translateY(-1.2px) scale(1.03); }
        55% { transform: translateY(-0.8px) scale(0.98); }
      }
      .ear-l {
        animation: hbEarL 4.5s ease-in-out infinite;
        transform-origin: 410px 190px;
      }
      .ear-r {
        animation: hbEarR 4.5s ease-in-out infinite;
        transform-origin: 614px 190px;
      }
      @keyframes hbEarL {
        0%, 86%, 100% { transform: rotate(0deg); }
        89% { transform: rotate(-5deg); }
        93% { transform: rotate(2deg); }
      }
      @keyframes hbEarR {
        0%, 86%, 100% { transform: rotate(0deg); }
        89% { transform: rotate(5deg); }
        93% { transform: rotate(-2deg); }
      }
      .noodle-1 { animation: hbNoodle1 3.2s ease-in-out infinite alternate; }
      .noodle-2 { animation: hbNoodle2 2.7s ease-in-out infinite alternate; }
      .noodle-3 { animation: hbNoodle3 3.5s ease-in-out infinite alternate; }
      @keyframes hbNoodle1 {
        0% { transform: translate(0px, 0px) scaleY(1); }
        100% { transform: translate(-6px, 5px) scaleY(1.06); }
      }
      @keyframes hbNoodle2 {
        0% { transform: translate(0px, 0px) scaleY(1); }
        100% { transform: translate(6px, -5px) scaleY(0.95); }
      }
      @keyframes hbNoodle3 {
        0% { transform: translate(0px, 0px); }
        100% { transform: translate(-4px, -4px); }
      }
      .laser-stream {
        stroke-dasharray: 80 26;
        animation: hbLaserFlow 1.6s linear infinite;
      }
      @keyframes hbLaserFlow {
        0% { stroke-dashoffset: 212; }
        100% { stroke-dashoffset: 0; }
      }
      .laser-pulse {
        animation: hbLaserPulse 1.5s ease-in-out infinite alternate;
      }
      @keyframes hbLaserPulse {
        0% { opacity: 0.88; }
        100% { opacity: 1; }
      }
      .bubble-float {
        animation: hbBubbleFloat 2.8s ease-in-out infinite alternate;
      }
      @keyframes hbBubbleFloat {
        0% { transform: translateY(0px) opacity(0.7); }
        100% { transform: translateY(-7px) opacity(1); }
      }
      .mono-text { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .sans-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect x="2" y="2" width="956" height="296" rx="18" fill="url(#hb-bg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Left Side: Content, Badges, Typography & Command Snippet -->
  <g transform="translate(44, 42)">
    <!-- Badges Row -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="138" height="25" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="12" cy="12.5" r="4" fill="#38bdf8"/>
      <text x="24" y="16.5" class="mono-text" font-size="11" fill="#94a3b8" font-weight="600">v0.1.0 • OPEN-SOURCE</text>

      <rect x="148" y="0" width="132" height="25" rx="6" fill="#13271f" stroke="#065f46" stroke-width="1"/>
      <circle cx="160" cy="12.5" r="4" fill="#10b981"/>
      <text x="172" y="16.5" class="mono-text" font-size="11" fill="#34d399" font-weight="600">HRI: GPU_DOMINANT</text>
    </g>

    <!-- Main Headline -->
    <text x="0" y="66" class="sans-text" font-size="33" font-weight="800" fill="#ffffff" letter-spacing="-0.03em">
      Hardware Arbiter
    </text>

    <!-- Subtitle -->
    <text x="0" y="98" class="sans-text" font-size="14.5" fill="#94a3b8" font-weight="400">
      O mascote <tspan fill="#f59e0b" font-weight="700">Pente</tspan> separa o fluxo de hardware:
    </text>
    <text x="0" y="120" class="sans-text" font-size="14" fill="#94a3b8" font-weight="400">
      Cargas pesadas vão com a GPU; a CPU fica lisa e sem nós.
    </text>

    <!-- Command Snippet Box -->
    <g transform="translate(0, 142)">
      <rect x="0" y="0" width="410" height="40" rx="8" fill="#080b13" stroke="#1e293b" stroke-width="1.5"/>
      <text x="15" y="25" class="mono-text" font-size="12.5" fill="#38bdf8">
        $ pip install -e . &amp;&amp; hardware-arbiter --apply
      </text>
    </g>

    <!-- Feature Pillars -->
    <g transform="translate(0, 206)">
      <text x="0" y="0" class="mono-text" font-size="11" fill="#64748b">
        <tspan fill="#38bdf8">✓</tspan> DirectML &amp; Vulkan   
        <tspan fill="#38bdf8" dx="16">✓</tspan> Thread-Clamping   
        <tspan fill="#38bdf8" dx="16">✓</tspan> EN / PT / ZH
      </text>
    </g>
  </g>

  <!-- Right Side: Backdrop Ambient Glow -->
  <circle cx="695" cy="165" r="145" fill="url(#hb-aura)"/>
  <ellipse cx="695" cy="254" rx="100" ry="15" fill="url(#hb-floor-shadow)"/>

  <!-- ================= MASCOT "PENTE" SCALED AT X=695, Y=165 ================= -->
  <g transform="translate(695, 165) scale(0.58) translate(-512, -305)">

    <!-- Animal Mascot Base Rig (Round Head + Feet) -->
    <g class="char-breathe">

      <!-- Sticker Halo Backing -->
      <g stroke="#111218" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="#111218">
        <circle cx="410" cy="190" r="34"/>
        <circle cx="614" cy="190" r="34"/>
        <path d="M 512 155 C 440 155, 360 215, 360 305 C 360 380, 375 425, 435 435 C 445 455, 485 455, 494 440 C 502 432, 522 432, 530 440 C 539 455, 579 455, 589 435 C 649 425, 664 380, 664 305 C 664 215, 584 155, 512 155 Z"/>
      </g>
      <!-- Sticker Outer Soft Rim -->
      <g stroke="#44485c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.65">
        <circle cx="410" cy="190" r="34"/>
        <circle cx="614" cy="190" r="34"/>
        <path d="M 512 155 C 440 155, 360 215, 360 305 C 360 380, 375 425, 435 435 C 445 455, 485 455, 494 440 C 502 432, 522 432, 530 440 C 539 455, 579 455, 589 435 C 649 425, 664 380, 664 305 C 664 215, 584 155, 512 155 Z"/>
      </g>

      <!-- Rounded Ears -->
      <g class="ear-l">
        <circle cx="410" cy="190" r="32" fill="url(#hb-patch)" stroke="#111218" stroke-width="8.5"/>
        <circle cx="410" cy="190" r="17" fill="#4d3e3d"/>
      </g>
      <g class="ear-r">
        <circle cx="614" cy="190" r="32" fill="url(#hb-patch)" stroke="#111218" stroke-width="8.5"/>
        <circle cx="614" cy="190" r="17" fill="#4d3e3d"/>
      </g>

      <!-- Round Head Base (Zero separate trunk) -->
      <path d="M 512 155 C 440 155, 360 215, 360 305 C 360 380, 375 425, 435 435 C 445 455, 485 455, 494 440 C 502 432, 522 432, 530 440 C 539 455, 579 455, 589 435 C 649 425, 664 380, 664 305 C 664 215, 584 155, 512 155 Z"
            fill="url(#hb-body-fur)" stroke="#111218" stroke-width="8.5" stroke-linejoin="round"/>

      <!-- Taupe Eye Mask Patches -->
      <path d="M 386 225 C 368 255, 362 285, 366 315 C 375 330, 415 330, 455 315 C 485 295, 485 240, 455 210 C 430 185, 400 200, 386 225 Z" fill="url(#hb-patch)"/>
      <path d="M 638 225 C 656 255, 662 285, 658 315 C 649 330, 609 330, 569 315 C 539 295, 539 240, 569 210 C 594 185, 624 200, 638 225 Z" fill="url(#hb-patch)"/>

      <!-- Cream Face Center -->
      <path d="M 512 172 C 485 172, 465 190, 455 215 C 485 240, 485 295, 455 315 C 440 322, 420 335, 420 355 C 420 395, 435 430, 494 435 C 502 428, 522 428, 530 435 C 589 430, 604 395, 604 355 C 604 335, 584 322, 569 315 C 539 295, 539 240, 569 210 C 559 180, 539 172, 512 172 Z" fill="url(#hb-cream)"/>

      <!-- Navy Vest on lower head sides -->
      <path d="M 364 340 C 358 375, 365 410, 400 428 L 440 395 C 415 375, 385 355, 364 340 Z" fill="url(#hb-vest)" stroke="#111218" stroke-width="6.5" stroke-linejoin="round"/>
      <path d="M 660 340 C 666 375, 659 410, 624 428 L 584 395 C 609 375, 639 355, 660 340 Z" fill="url(#hb-vest)" stroke="#111218" stroke-width="6.5" stroke-linejoin="round"/>

      <!-- Rosy Cheeks -->
      <ellipse cx="421.0" cy="312.2" rx="25" ry="16" fill="url(#hb-cheek)"/>
      <ellipse cx="602.2" cy="312.2" rx="25" ry="16" fill="url(#hb-cheek)"/>

      <!-- Eyes -->
      <g class="eye-blink">
        <g id="hb-eye-l">
          <circle cx="453.1" cy="276.3" r="23" fill="#111218" stroke="#111218" stroke-width="3"/>
          <g class="pupil-track">
            <circle cx="445.5" cy="268.7" r="8.2" fill="#ffffff"/>
            <circle cx="463.3" cy="286.4" r="3.9" fill="#ffffff"/>
          </g>
        </g>
        <g id="hb-eye-r">
          <circle cx="571.9" cy="276.4" r="23" fill="#111218" stroke="#111218" stroke-width="3"/>
          <g class="pupil-track">
            <circle cx="564.0" cy="268.6" r="8.2" fill="#ffffff"/>
            <circle cx="581.8" cy="286.2" r="3.9" fill="#ffffff"/>
          </g>
        </g>
      </g>

      <!-- Snout & :3 Mouth -->
      <g class="snout-twitch">
        <path d="M 500 286 C 500 284, 523 284, 523 286 C 523 294, 517 301, 511.5 301 C 506 301, 500 294, 500 286 Z" fill="#111218"/>
        <ellipse cx="508" cy="288" rx="2.5" ry="1.5" fill="#ffffff"/>
        <line x1="511.5" y1="301" x2="511.5" y2="307" stroke="#111218" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M 497 306 Q 504 314 511.5 307 Q 519 314 526 306" fill="none" stroke="#111218" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- Feet -->
      <path d="M 438 435 C 440 455, 480 458, 492 440" fill="#2d2524" stroke="#111218" stroke-width="6.5" stroke-linejoin="round"/>
      <path d="M 532 440 C 544 458, 584 455, 586 435" fill="#2d2524" stroke="#111218" stroke-width="6.5" stroke-linejoin="round"/>
    </g>

    <!-- ================= FOREGROUND: CONTINUOUS HAIR STREAM & ACTION OF COMBING ================= -->
    <!-- Fully connected strands: Left (Chaotic) -> Left Hand (Holding) -> Comb (Combing) -> Right (Straight Lasers) -->
    <g filter="url(#hb-cyan-glow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Strand 1 -->
      <path class="noodle-1" stroke="#00f2fe" stroke-width="4.8"
            d="M 120 275 C 240 260, 320 320, 390 345 C 420 355, 440 365, 455 368 C 485 352, 515 342, 545 333.5"/>
      <line class="laser-stream laser-pulse" x1="545" y1="333.5" x2="980" y2="333.5" stroke="#00f2fe" stroke-width="5.5"/>

      <!-- Strand 2 -->
      <path class="noodle-2" stroke="#38bdf8" stroke-width="5"
            d="M 100 305 C 250 335, 330 295, 400 360 C 430 368, 445 372, 458 375 C 490 360, 520 352, 552 345.5"/>
      <line class="laser-stream laser-pulse" x1="552" y1="345.5" x2="980" y2="345.5" stroke="#38bdf8" stroke-width="5"/>

      <!-- Strand 3 -->
      <path class="noodle-3" stroke="#00f2fe" stroke-width="4.5"
            d="M 140 330 C 230 365, 310 330, 390 370 C 425 375, 450 378, 462 380 C 495 368, 525 362, 558 356.0"/>
      <line class="laser-stream laser-pulse" x1="558" y1="356.0" x2="980" y2="356.0" stroke="#00f2fe" stroke-width="5.5"/>

      <!-- Strand 4 -->
      <path class="noodle-1" stroke="#38bdf8" stroke-width="5.2"
            d="M 110 360 C 240 340, 320 390, 400 380 C 430 382, 452 384, 465 385 C 500 376, 530 372, 562 367.5"/>
      <line class="laser-stream laser-pulse" x1="562" y1="367.5" x2="980" y2="367.5" stroke="#38bdf8" stroke-width="5"/>

      <!-- Strand 5 -->
      <path class="noodle-2" stroke="#00f2fe" stroke-width="4"
            d="M 130 395 C 260 410, 330 375, 410 395 C 435 392, 455 390, 468 392 C 505 385, 535 380, 568 376.5"/>
      <line class="laser-stream laser-pulse" x1="568" y1="376.5" x2="980" y2="376.5" stroke="#00f2fe" stroke-width="5.5"/>

      <!-- Strand 6 -->
      <path class="noodle-3" stroke="#38bdf8" stroke-width="4.2"
            d="M 150 435 C 270 435, 350 395, 420 405 C 440 400, 458 396, 470 398 C 510 394, 540 390, 574 386.5"/>
      <line class="laser-stream laser-pulse" x1="574" y1="386.5" x2="980" y2="386.5" stroke="#38bdf8" stroke-width="5"/>
    </g>

    <!-- Floating Particles -->
    <g class="bubble-float" fill="#00f2fe" opacity="0.9">
      <circle cx="310" cy="262" r="3.5"/>
      <circle cx="385" cy="354" r="3"/>
      <circle cx="330" cy="287" r="4" fill="none" stroke="#00f2fe" stroke-width="1.8"/>
      <circle cx="238" cy="275" r="3" fill="none" stroke="#00f2fe" stroke-width="1.5"/>
    </g>

    <!-- Left Hand: Clasping and Holding the Hair Bundle in place -->
    <g class="holding-hand" id="hb-left-hand">
      <path d="M 395 345 Q 425 352 445 362 Q 435 378 405 372 Z" fill="url(#hb-patch)" stroke="#111218" stroke-width="6"/>
      <circle cx="452" cy="365" r="20" fill="url(#hb-patch)" stroke="#111218" stroke-width="7"/>
      <circle cx="450" cy="363" r="13" fill="#8c7a78"/>
      <path d="M 445 355 Q 452 358 458 355" fill="none" stroke="#111218" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 444 372 Q 452 375 458 372" fill="none" stroke="#111218" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Right Hand & Amber Comb: Combing motion -->
    <g class="comb-motion" id="hb-comb-rig">
      <g transform="translate(520, 362) rotate(-28.4)">
        <rect x="-68" y="-13" width="136" height="25" rx="8" fill="url(#hb-comb-amber)" stroke="#111218" stroke-width="5.5"/>
        <line x1="-58" y1="-6" x2="58" y2="-6" stroke="url(#hb-comb-gold)" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
        <g fill="url(#hb-comb-amber)" stroke="#111218" stroke-width="4.2" stroke-linejoin="round">
          <rect x="-54" y="10" width="7.5" height="32" rx="3.5"/>
          <rect x="-40" y="10" width="7.5" height="34" rx="3.5"/>
          <rect x="-26" y="10" width="7.5" height="35" rx="3.5"/>
          <rect x="-12" y="10" width="7.5" height="36" rx="3.5"/>
          <rect x="2" y="10" width="7.5" height="36" rx="3.5"/>
          <rect x="16" y="10" width="7.5" height="35" rx="3.5"/>
          <rect x="30" y="10" width="7.5" height="34" rx="3.5"/>
          <rect x="44" y="10" width="7.5" height="32" rx="3.5"/>
        </g>
      </g>
      <path d="M 640 348 Q 612 362 590 374 Q 600 390 625 378 Z" fill="url(#hb-patch)" stroke="#111218" stroke-width="6"/>
      <circle cx="582" cy="378" r="20" fill="url(#hb-patch)" stroke="#111218" stroke-width="7"/>
      <circle cx="584" cy="375" r="13" fill="#8c7a78"/>
      <path d="M 575 368 Q 582 371 588 368" fill="none" stroke="#111218" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 576 385 Q 583 388 589 385" fill="none" stroke="#111218" stroke-width="2.5" stroke-linecap="round"/>
    </g>

  </g>
</svg>
