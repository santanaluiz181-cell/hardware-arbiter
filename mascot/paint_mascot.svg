<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="100%" height="100%">
  <defs>
    <style>
      .retro-bg { fill: #0f1117; }
      .window-border { fill: #1c202d; stroke: #32394e; stroke-width: 3; }
      .window-header { fill: #1a2030; }
      .title-text { font-family: 'Courier New', monospace; font-size: 14px; fill: #8b9bb4; font-weight: bold; }
      .grid-line { stroke: #191f2e; stroke-width: 1; }
      .cyan-glow { filter: drop-shadow(0 0 8px #00f2feaa); }
      .amber-glow { filter: drop-shadow(0 0 8px #f59e0baa); }
      .pixel-font { font-family: 'Courier New', monospace; font-weight: bold; }
    </style>
    
    <!-- Linear gradients for paint sweeps -->
    <linearGradient id="gpuGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052d4" />
      <stop offset="50%" stop-color="#4364f7" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <linearGradient id="cpuGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="rollerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="640" height="480" class="retro-bg" rx="12" />

  <!-- Retro Window Frame (MS Paint tribute) -->
  <rect x="20" y="20" width="600" height="440" rx="8" class="window-border" />
  <rect x="20" y="20" width="600" height="34" rx="8" class="window-header" />
  
  <!-- Window Buttons -->
  <circle cx="42" cy="37" r="6" fill="#ef4444" />
  <circle cx="60" cy="37" r="6" fill="#f59e0b" />
  <circle cx="78" cy="37" r="6" fill="#10b981" />
  <text x="100" y="42" class="title-text">hardware-arbiter :: paint_mascot.canvas (v1.0)</text>

  <!-- Retro grid canvas lines -->
  <g opacity="0.6">
    <line x1="30" y1="100" x2="610" y2="100" class="grid-line" />
    <line x1="30" y1="160" x2="610" y2="160" class="grid-line" />
    <line x1="30" y1="220" x2="610" y2="220" class="grid-line" />
    <line x1="30" y1="280" x2="610" y2="280" class="grid-line" />
    <line x1="30" y1="340" x2="610" y2="340" class="grid-line" />
    <line x1="30" y1="400" x2="610" y2="400" class="grid-line" />
    <line x1="100" y1="60" x2="100" y2="450" class="grid-line" />
    <line x1="200" y1="60" x2="200" y2="450" class="grid-line" />
    <line x1="300" y1="60" x2="300" y2="450" class="grid-line" />
    <line x1="400" y1="60" x2="400" y2="450" class="grid-line" />
    <line x1="500" y1="60" x2="500" y2="450" class="grid-line" />
  </g>

  <!-- Big Smooth GPU Paint Sweep (Clean, Wide, Fast) -->
  <path d="M 50 140 Q 180 120 310 150 L 310 240 Q 180 210 50 230 Z" fill="url(#gpuGrad)" class="cyan-glow" opacity="0.9" />
  <text x="70" y="190" class="pixel-font" font-size="18" fill="#ffffff" letter-spacing="2">GPU OFFLOAD [DIRECTML / VULKAN]</text>
  <text x="70" y="212" class="pixel-font" font-size="11" fill="#cffafe">100% EMBEDDINGS • VISION • OCR • ASR (CLEARED)</text>

  <!-- Slim Amber CPU Paint Strip (Light, Thread-Clamped) -->
  <path d="M 50 290 Q 200 280 340 300 L 340 345 Q 200 325 50 335 Z" fill="url(#cpuGrad)" class="amber-glow" opacity="0.85" />
  <text x="70" y="322" class="pixel-font" font-size="14" fill="#ffffff" letter-spacing="1">CPU THREAD-CLAMP [OMP=2 / UV=4]</text>

  <!-- ================= MASCOT: "PAINT THE ARBITER" ================= -->
  <!-- A lively retro paint roller character with big expressive eyes and a tool belt -->
  <g transform="translate(320, 100)">
    <!-- Roller Paint Trail Splash -->
    <ellipse cx="60" cy="90" rx="35" ry="12" fill="#00f2fe" opacity="0.4" />
    <circle cx="25" cy="85" r="5" fill="#00f2fe" />
    <circle cx="45" cy="105" r="7" fill="#00f2fe" />
    <circle cx="10" cy="115" r="4" fill="#00f2fe" />

    <!-- Paint Roller Body Cylinder (Wide, Soft-Beveled) -->
    <rect x="20" y="30" width="80" height="130" rx="20" fill="url(#rollerGrad)" stroke="#1e293b" stroke-width="4" />
    
    <!-- Wet Paint on the Roller (Neon Cyan) -->
    <path d="M 20 45 Q 60 65 100 45 L 100 140 Q 60 160 20 140 Z" fill="#00f2fe" />
    
    <!-- Dripping Paint Drops from Roller -->
    <path d="M 40 145 C 40 160, 48 160, 48 145 Z" fill="#00f2fe" />
    <path d="M 75 145 C 75 165, 85 165, 85 145 Z" fill="#00f2fe" />

    <!-- Roller Handle Frame (Metal Wire) -->
    <path d="M 60 30 L 60 10 L 125 10 L 125 170 L 85 170" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Wooden / Ergonomic Handle Grip -->
    <rect x="115" y="160" width="20" height="70" rx="6" fill="#d97706" stroke="#78350f" stroke-width="3" />
    <line x1="115" y1="180" x2="135" y2="180" stroke="#78350f" stroke-width="2" />
    <line x1="115" y1="200" x2="135" y2="200" stroke="#78350f" stroke-width="2" />

    <!-- MASCOT FACE (Expressive Retro Eyes on Roller Body) -->
    <!-- Left Eye -->
    <circle cx="45" cy="85" r="13" fill="#ffffff" stroke="#0f172a" stroke-width="3" />
    <circle cx="48" cy="84" r="7" fill="#0f172a" />
    <circle cx="51" cy="81" r="2.5" fill="#ffffff" /> <!-- Glint -->

    <!-- Right Eye -->
    <circle cx="75" cy="85" r="13" fill="#ffffff" stroke="#0f172a" stroke-width="3" />
    <circle cx="78" cy="84" r="7" fill="#0f172a" />
    <circle cx="81" cy="81" r="2.5" fill="#ffffff" /> <!-- Glint -->

    <!-- Cheerful Smile -->
    <path d="M 52 110 Q 62 122 72 110" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" />
    
    <!-- Blushing cheeks -->
    <ellipse cx="38" cy="102" rx="4" ry="2.5" fill="#f43f5e" opacity="0.6" />
    <ellipse cx="82" cy="102" rx="4" ry="2.5" fill="#f43f5e" opacity="0.6" />

    <!-- Cute Retro Headband / Visor (Tribute to Pixel Craftsmen) -->
    <path d="M 18 42 Q 60 55 102 42" stroke="#f59e0b" stroke-width="7" stroke-linecap="round" fill="none" />
    <rect x="52" y="32" width="16" height="12" rx="2" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
    <text x="54" y="41" font-family="monospace" font-size="8" fill="#fbbf24" font-weight="bold">HRI</text>

    <!-- Companion: Mini Brush for the CPU (Held playfully by metal arm) -->
    <g transform="translate(130, 90) rotate(25)">
      <!-- Brush Handle -->
      <rect x="0" y="0" width="8" height="40" rx="3" fill="#94a3b8" stroke="#334155" stroke-width="1.5" />
      <rect x="-2" y="35" width="12" height="12" rx="2" fill="#f59e0b" />
      <!-- Bristles with Amber Paint -->
      <path d="M -2 47 L 10 47 L 8 62 L 0 62 Z" fill="#d97706" />
      <circle cx="4" cy="66" r="3" fill="#f59e0b" />
    </g>
  </g>

  <!-- Bottom Terminal Status Bar -->
  <rect x="35" y="415" width="570" height="32" rx="6" fill="#131722" stroke="#2a334a" stroke-width="1.5" />
  <circle cx="52" cy="431" r="4" fill="#10b981" />
  <text x="66" y="435" class="pixel-font" font-size="11" fill="#94a3b8">
    STATUS: <tspan fill="#38bdf8">GPU_DOMINANT (HRI=17.0x)</tspan> | CPU RELIEVED: <tspan fill="#4ade80">-46% LOAD</tspan> | SYSTEM: <tspan fill="#facc15">BALANCED &amp; COOL</tspan>
  </text>
</svg>
