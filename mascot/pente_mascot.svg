<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" width="100%" height="100%" role="img" aria-label="Pente Fino — The Dapper Hardware Comb Mascot">
  <defs>
    <!-- Background aura -->
    <radialGradient id="comb-aura" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>

    <!-- Tortoise/Amber Shell Material for Comb Spine -->
    <linearGradient id="comb-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="25%" stop-color="#d97706"/>
      <stop offset="60%" stop-color="#b45309"/>
      <stop offset="90%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Metallic/Gold Accent -->
    <linearGradient id="comb-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Comb Teeth Gradient (Shining Titanium/Gold) -->
    <linearGradient id="tooth-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="30%" stop-color="#fde68a"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- GPU Cyan Stream (Combed away) -->
    <linearGradient id="gpu-stream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.2"/>
    </linearGradient>

    <!-- CPU Amber Threads (Staying close) -->
    <linearGradient id="cpu-stream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Cheek Blush Radial -->
    <radialGradient id="comb-blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.8"/>
      <stop offset="65%" stop-color="#f43f5e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.75"/>
    </filter>
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.85"/>
    </filter>

    <style>
      @keyframes combBreathe {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-5px) rotate(-1deg); }
      }
      @keyframes strandSweep {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes blink {
        0%, 90%, 100% { transform: scaleY(1); }
        95% { transform: scaleY(0.1); }
      }
      .comb-group {
        animation: combBreathe 4s ease-in-out infinite;
        transform-origin: 260px 240px;
      }
      .gpu-strand {
        stroke-dasharray: 80 40;
        animation: strandSweep 3s linear infinite;
      }
      .eye-blink {
        transform-origin: 260px 175px;
        animation: blink 4.5s ease-in-out infinite;
      }
      .mono-label {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
        font-weight: 700;
      }
    </style>
  </defs>

  <!-- Canvas Backdrop -->
  <rect width="520" height="480" fill="#0b0f19" rx="16"/>
  <circle cx="260" cy="220" r="210" fill="url(#comb-aura)"/>

  <!-- ================= BACKGROUND WORKLOAD STRANDS ================= -->
  <!-- Entangled chaotic strands entering the comb from bottom-left -->
  <g opacity="0.45" stroke-linecap="round">
    <path d="M 40 400 Q 140 370 200 310" fill="none" stroke="#64748b" stroke-width="4"/>
    <path d="M 60 420 Q 170 380 230 310" fill="none" stroke="#64748b" stroke-width="3"/>
    <path d="M 80 440 Q 190 400 250 310" fill="none" stroke="#64748b" stroke-width="4"/>
    <path d="M 110 450 Q 210 410 270 310" fill="none" stroke="#64748b" stroke-width="3"/>
  </g>

  <!-- ================= GPU OFF-LOADED STRANDS (SWEPT OUT BY TEETH) ================= -->
  <!-- Silky smooth, glowing cyan strands carried away by the comb teeth -->
  <g filter="url(#cyan-glow)">
    <path class="gpu-strand" d="M 230 310 C 240 360 210 410 160 440" fill="none" stroke="#38bdf8" stroke-width="5"/>
    <path class="gpu-strand" d="M 260 310 C 280 370 260 430 200 460" fill="none" stroke="#00f2fe" stroke-width="6"/>
    <path class="gpu-strand" d="M 290 310 C 320 380 310 430 270 465" fill="none" stroke="#38bdf8" stroke-width="5"/>
    <path class="gpu-strand" d="M 320 310 C 360 370 370 430 350 460" fill="none" stroke="#00f2fe" stroke-width="6"/>
    <path class="gpu-strand" d="M 350 310 C 400 370 430 420 440 450" fill="none" stroke="#38bdf8" stroke-width="5"/>
  </g>
  <text x="360" y="445" class="mono-label" font-size="11" fill="#38bdf8" letter-spacing="1">GPU: OFFLOADED ➔</text>

  <!-- ================= CPU ROOTS (STAYING HARMONIOUSLY) ================= -->
  <g opacity="0.8">
    <path d="M 180 310 Q 170 270 160 230" fill="none" stroke="url(#cpu-stream)" stroke-width="4" stroke-dasharray="6 4"/>
    <path d="M 200 310 Q 190 260 185 220" fill="none" stroke="url(#cpu-stream)" stroke-width="3"/>
  </g>
  <text x="50" y="225" class="mono-label" font-size="11" fill="#f59e0b" letter-spacing="1">CPU: THREADS STAY</text>

  <!-- ================= THE MASCOT: PENTE FINO (THE DAPPER COMB) ================= -->
  <g class="comb-group" filter="url(#soft-shadow)">
    
    <!-- 1. The Teeth (Precision engineered, rounded tips) -->
    <g id="comb-teeth">
      <!-- 17 Teeth with titanium/gold luster and glowing cyan tips -->
      <!-- Teeth X span: 145 to 375 -->
      <!-- Tooth 1 --> <rect x="145" y="200" width="7" height="110" rx="3.5" fill="url(#tooth-grad)"/>
      <!-- Tooth 2 --> <rect x="160" y="200" width="7" height="112" rx="3.5" fill="url(#tooth-grad)"/>
      <!-- Tooth 3 --> <rect x="175" y="200" width="7" height="114" rx="3.5" fill="url(#tooth-grad)"/>
      <!-- Tooth 4 --> <rect x="190" y="200" width="7" height="115" rx="3.5" fill="url(#tooth-grad)"/>
      <!-- Tooth 5 --> <rect x="205" y="200" width="7" height="115" rx="3.5" fill="url(#tooth-grad)"/>
      <!-- Tooth 6 --> <rect x="220" y="200" width="7" height="115" rx="3.5" fill="url(#tooth-grad)"/>
      <!-- Tooth 7 --> <rect x="235" y="200" width="7" height="115" rx="3.5" fill="url(#tooth-grad)"/>
      <!-- Tooth 8 --> <rect x="250" y="200" width="7" height="115" rx="3.5" fill="url(#tooth-grad)"/>
      <!-- Tooth 9 --> <rect x="265" y="200" width="7" height="115" rx="3.5" fill="url(#tooth-grad)"/>
      <!-- Tooth 10 --> <rect x="280" y="200" width="7" height="115" rx="3.5" fill="url(#tooth-grad)"/>
      <!-- Tooth 11 --> <rect x="295" y="200" width="7" height="115" rx="3.5" fill="url(#tooth-grad)"/>
      <!-- Tooth 12 --> <rect x="310" y="200" width="7" height="115" rx="3.5" fill="url(#tooth-grad)"/>
      <!-- Tooth 13 --> <rect x="325" y="200" width="7" height="115" rx="3.5" fill="url(#tooth-grad)"/>
      <!-- Tooth 14 --> <rect x="340" y="200" width="7" height="114" rx="3.5" fill="url(#tooth-grad)"/>
      <!-- Tooth 15 --> <rect x="355" y="200" width="7" height="112" rx="3.5" fill="url(#tooth-grad)"/>
      <!-- Tooth 16 --> <rect x="370" y="200" width="7" height="110" rx="3.5" fill="url(#tooth-grad)"/>

      <!-- Glowing tips where the comb meets the GPU stream -->
      <circle cx="238.5" cy="312" r="4.5" fill="#38bdf8" filter="url(#cyan-glow)"/>
      <circle cx="268.5" cy="312" r="4.5" fill="#38bdf8" filter="url(#cyan-glow)"/>
      <circle cx="298.5" cy="312" r="4.5" fill="#38bdf8" filter="url(#cyan-glow)"/>
      <circle cx="328.5" cy="312" r="4.5" fill="#38bdf8" filter="url(#cyan-glow)"/>
    </g>

    <!-- 2. The Comb Spine / Body (Arched classic dapper comb back) -->
    <!-- Beautiful ergonomic arched tortoise-shell back with bevels -->
    <path d="M 115 210 Q 110 120 260 115 Q 410 120 405 210 Q 400 220 380 220 L 140 220 Q 120 220 115 210 Z" 
          fill="url(#comb-body)" stroke="#78350f" stroke-width="4"/>

    <!-- Gold Inlay Border along the top arch -->
    <path d="M 125 200 Q 120 132 260 127 Q 400 132 395 200" 
          fill="none" stroke="url(#comb-gold)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- 3. Dapper Gentleman Accessories on the Spine -->
    <!-- Fedora-style or Dapper Hat on the comb peak -->
    <g transform="translate(260, 110)">
      <!-- Hat Brim -->
      <ellipse cx="0" cy="5" rx="46" ry="9" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
      <!-- Hat Crown -->
      <path d="M -26 5 C -28 -20, -18 -32, 0 -30 C 18 -32, 28 -20, 26 5 Z" fill="#0f172a"/>
      <!-- Amber / Gold Hat Ribbon -->
      <path d="M -26 2 C -18 0, 18 0, 26 2 L 25 5 C 18 3, -18 3, -25 5 Z" fill="url(#comb-gold)"/>
      <!-- Small Hardware Gear / Pin on Hat -->
      <circle cx="16" cy="3" r="3.5" fill="#38bdf8"/>
    </g>

    <!-- 4. Expressive Mascot Eyes (Foquinha / Phanty style: big, sparkling, soulful) -->
    <g class="eye-blink">
      <!-- Left Eye -->
      <circle cx="218" cy="172" r="16" fill="#ffffff" stroke="#1e293b" stroke-width="2.5"/>
      <circle cx="221" cy="171" r="9.5" fill="#0f172a"/>
      <circle cx="225" cy="167" r="3.5" fill="#ffffff"/> <!-- Primary glint -->
      <circle cx="217" cy="174" r="1.8" fill="#ffffff"/> <!-- Secondary sparkle -->

      <!-- Right Eye -->
      <circle cx="302" cy="172" r="16" fill="#ffffff" stroke="#1e293b" stroke-width="2.5"/>
      <circle cx="299" cy="171" r="9.5" fill="#0f172a"/>
      <circle cx="303" cy="167" r="3.5" fill="#ffffff"/> <!-- Primary glint -->
      <circle cx="295" cy="174" r="1.8" fill="#ffffff"/> <!-- Secondary sparkle -->

      <!-- Dapper Monocle on Right Eye (like Phanty!) -->
      <circle cx="302" cy="172" r="19" fill="none" stroke="url(#comb-gold)" stroke-width="3"/>
      <path d="M 321 172 Q 330 178 335 195" fill="none" stroke="url(#comb-gold)" stroke-width="1.8"/>
      <!-- Monocle glass glint -->
      <path d="M 292 162 Q 302 158 312 165" fill="none" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    </g>

    <!-- Cheerful rosy cheeks -->
    <ellipse cx="198" cy="186" rx="9" ry="5.5" fill="url(#comb-blush)"/>
    <ellipse cx="322" cy="186" rx="9" ry="5.5" fill="url(#comb-blush)"/>

    <!-- Happy friendly mouth -->
    <path d="M 248 185 Q 260 196 272 185" fill="none" stroke="#451a03" stroke-width="3.5" stroke-linecap="round"/>

    <!-- 5. Dapper Bow Tie at bottom center of the comb spine -->
    <g transform="translate(260, 218)">
      <polygon points="-16,-6 -16,6 0,0" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>
      <polygon points="16,-6 16,6 0,0" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="4.5" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
    </g>

    <!-- 6. Handle Extension / Ergonomic Tail (Left side of classic comb) -->
    <path d="M 120 205 C 80 200, 50 180, 40 145 C 35 125, 45 110, 60 115 C 85 125, 105 160, 125 185 Z" 
          fill="url(#comb-body)" stroke="#78350f" stroke-width="3"/>
    <circle cx="50" cy="132" r="5" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  </g>

  <!-- ================= BOTTOM STATUS PILL ================= -->
  <g transform="translate(260, 440)">
    <rect x="-190" y="-16" width="380" height="32" rx="16" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <circle cx="-168" cy="0" r="5" fill="#10b981"/>
    <text x="-150" y="4" class="mono-label" font-size="11" fill="#94a3b8">
      PENTE FINO: <tspan fill="#38bdf8">GPU SEPARADA</tspan> | <tspan fill="#f59e0b">CPU LIMPA</tspan>
    </text>
  </g>
</svg>
