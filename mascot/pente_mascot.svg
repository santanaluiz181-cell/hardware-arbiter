<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Comb Body (Tortoise-shell Amber with warm luster) -->
    <linearGradient id="combLoaf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Chest belly patch (lighter amber/cream like the fox & seal) -->
    <linearGradient id="bellyPatch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <!-- Comb Teeth Gradient -->
    <linearGradient id="teethGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Gold Monocle Gradient (from Elephant) -->
    <linearGradient id="goldMonocle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Drop Shadow on ground -->
    <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#020617" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep Dark Slate Background -->
  <rect width="512" height="512" fill="url(#bgGlow)"/>

  <!-- Soft Ground Shadow under the loaf -->
  <ellipse cx="256" cy="430" rx="140" ry="22" fill="url(#groundShadow)"/>

  <!-- ================= PENTE FINO MASCOT (CHIBI LOAF BEAN ANATOMY) ================= -->
  <!-- Outer Sticker Border / Halo (Exact DNA from Elephant, Fox & Foquinha) -->
  <g id="sticker-border" stroke="#334155" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" fill="none" opacity="0.65">
    <!-- Outer boundary of Comb Teeth + Body + Paws -->
    <path d="M 126 406 
             L 126 230 
             Q 126 130 256 122 
             Q 386 130 386 230 
             L 386 406 
             Q 386 414 374 414 
             L 138 414 
             Q 126 414 126 406 Z"/>
  </g>

  <!-- Main Body Group -->
  <g id="mascot-body">
    
    <!-- 1. COMB TEETH CREST (Crown of the comb rising on top of the bean) -->
    <g id="comb-crown" stroke="#1e293b" stroke-width="4.5" stroke-linejoin="round">
      <!-- 7 Precision Teeth on the Comb Head -->
      <rect x="175" y="75" width="14" height="65" rx="7" fill="url(#teethGrad)"/>
      <rect x="199" y="65" width="14" height="75" rx="7" fill="url(#teethGrad)"/>
      <rect x="223" y="58" width="14" height="82" rx="7" fill="url(#teethGrad)"/>
      <rect x="247" y="54" width="14" height="86" rx="7" fill="url(#teethGrad)"/>
      <rect x="271" y="58" width="14" height="82" rx="7" fill="url(#teethGrad)"/>
      <rect x="295" y="65" width="14" height="75" rx="7" fill="url(#teethGrad)"/>
      <rect x="319" y="75" width="14" height="65" rx="7" fill="url(#teethGrad)"/>
      <!-- Glowing cyan tips where it catches GPU data -->
      <circle cx="254" cy="58" r="4" fill="#38bdf8"/>
      <circle cx="230" cy="62" r="3.5" fill="#38bdf8"/>
      <circle cx="278" cy="62" r="3.5" fill="#38bdf8"/>
    </g>

    <!-- 2. SQUISHY CHUBBY LOAF BODY (Thick black outline, flat base) -->
    <path d="M 132 400 
             L 132 230 
             C 132 140 180 135 256 135 
             C 332 135 380 140 380 230 
             L 380 400 
             C 380 410 370 410 360 410 
             L 152 410 
             C 142 410 132 410 132 400 Z" 
          fill="url(#combLoaf)" stroke="#0f172a" stroke-width="8" stroke-linejoin="round"/>

    <!-- 3. SOFT BELLY PATCH (Light Cream) -->
    <path d="M 175 408 
             C 175 320 200 290 256 290 
             C 312 290 337 320 337 408 
             Z" 
          fill="url(#bellyPatch)" stroke="#0f172a" stroke-width="5" stroke-linejoin="round"/>

    <!-- 4. SIGNATURE CHIBI EYES (Double-Sparkle Anime Glints) -->
    <!-- Left Eye -->
    <g id="left-eye">
      <circle cx="206" cy="245" r="28" fill="#ffffff" stroke="#0f172a" stroke-width="6"/>
      <circle cx="208" cy="245" r="19" fill="#0f172a"/>
      <!-- Primary Big Glint (Top-Left) -->
      <circle cx="215" cy="238" r="7.5" fill="#ffffff"/>
      <!-- Secondary Small Glint (Bottom-Right) -->
      <circle cx="202" cy="252" r="3.5" fill="#ffffff"/>
    </g>

    <!-- Right Eye with Elephant-style Monocle -->
    <g id="right-eye">
      <circle cx="306" cy="245" r="28" fill="#ffffff" stroke="#0f172a" stroke-width="6"/>
      <circle cx="304" cy="245" r="19" fill="#0f172a"/>
      <!-- Primary Big Glint (Top-Left) -->
      <circle cx="311" cy="238" r="7.5" fill="#ffffff"/>
      <!-- Secondary Small Glint (Bottom-Right) -->
      <circle cx="298" cy="252" r="3.5" fill="#ffffff"/>

      <!-- Golden Monocle Ring (Matches Phanty the Elephant) -->
      <circle cx="306" cy="245" r="33" fill="none" stroke="url(#goldMonocle)" stroke-width="5.5"/>
      <!-- Monocle chain dangling down -->
      <path d="M 339 245 Q 360 265 352 305" fill="none" stroke="url(#goldMonocle)" stroke-width="3" stroke-dasharray="3 3"/>
      <circle cx="352" cy="307" r="3.5" fill="#eab308"/>
    </g>

    <!-- 5. CHEEKS (Soft Pink Horizontal Ovals) -->
    <ellipse cx="166" cy="275" rx="15" ry="8.5" fill="#f43f5e" opacity="0.65"/>
    <ellipse cx="346" cy="275" rx="15" ry="8.5" fill="#f43f5e" opacity="0.65"/>

    <!-- 6. CUTE SNOUT & SMILE (Minimalist kawaii curve) -->
    <g id="mouth">
      <!-- Nose / Comb spine pin -->
      <circle cx="256" cy="260" r="4.5" fill="#0f172a"/>
      <path d="M 256 264 L 256 272" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
      <path d="M 242 272 Q 256 284 270 272" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- 7. DAPPER ACCESSORY: Cyan Bow Tie (Hardware Theme) -->
    <g transform="translate(256, 316)">
      <!-- Left Wing -->
      <polygon points="-24,-10 -24,10 0,0" fill="#38bdf8" stroke="#0f172a" stroke-width="3.5"/>
      <!-- Right Wing -->
      <polygon points="24,-10 24,10 0,0" fill="#38bdf8" stroke="#0f172a" stroke-width="3.5"/>
      <!-- Center Knot -->
      <circle cx="0" cy="0" r="6" fill="#f59e0b" stroke="#0f172a" stroke-width="2.5"/>
    </g>

    <!-- 8. STUBBY CHIBI PAWS (Resting flat on the base like Fox & Foquinha) -->
    <!-- Left Paw -->
    <path d="M 152 408 C 152 388 175 388 198 388 C 210 388 214 398 214 410 Z" 
          fill="#451a03" stroke="#0f172a" stroke-width="5" stroke-linejoin="round"/>
    <!-- Right Paw -->
    <path d="M 298 410 C 298 398 302 388 314 388 C 337 388 360 388 360 408 Z" 
          fill="#451a03" stroke="#0f172a" stroke-width="5" stroke-linejoin="round"/>

    <!-- 9. COMB TEETH ENGAGEMENT (GPU Cyan Stream on Right vs CPU Amber Root on Left) -->
    <!-- GPU stream flowing out of paws -->
    <path d="M 360 395 Q 400 390 440 415" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="445" cy="417" r="4" fill="#38bdf8"/>
    <!-- CPU root resting clean on left -->
    <path d="M 148 400 Q 110 400 80 415" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" stroke-dasharray="6 4"/>
  </g>
</svg>
