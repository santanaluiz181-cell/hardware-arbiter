<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="Hardware Arbiter Hero Banner with Pandinha Pente Fino Mascot">
  <defs>
    <!-- Card Frame Gradient -->
    <linearGradient id="hb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e121d"/>
      <stop offset="45%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0b0e17"/>
    </linearGradient>

    <!-- Panda Aura Glow -->
    <radialGradient id="hb-panda-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#141824" stop-opacity="0"/>
    </radialGradient>

    <!-- Panda Dark Fur Gradient -->
    <linearGradient id="panda-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a5662"/>
      <stop offset="50%" stop-color="#4a4752"/>
      <stop offset="100%" stop-color="#383540"/>
    </linearGradient>

    <!-- Panda Cream Face & Belly -->
    <linearGradient id="panda-cream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="70%" stop-color="#f5ede0"/>
      <stop offset="100%" stop-color="#ebdcc9"/>
    </linearGradient>

    <!-- Navy Waistcoat / Vest -->
    <linearGradient id="panda-vest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a324b"/>
      <stop offset="100%" stop-color="#191f33"/>
    </linearGradient>

    <!-- Amber Comb Material -->
    <linearGradient id="comb-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbb44c"/>
      <stop offset="40%" stop-color="#e5933a"/>
      <stop offset="100%" stop-color="#c4711e"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00f2fe" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#0284c7" flood-opacity="0.5"/>
    </filter>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.8"/>
    </filter>

    <radialGradient id="cheek-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f47285" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#f47285" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f47285" stop-opacity="0"/>
    </radialGradient>

    <!-- Inline Animations -->
    <style>
      .char-breathe {
        animation: breatheAnim 3.8s ease-in-out infinite;
        transform-origin: 480px 280px;
      }
      @keyframes breatheAnim {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-4px) scale(1.008); }
      }
      .comb-motion {
        animation: combStroke 2.2s ease-in-out infinite;
        transform-origin: 470px 300px;
      }
      @keyframes combStroke {
        0%, 100% { transform: translate(0px, 0px) rotate(-1.5deg); }
        25% { transform: translate(6px, -2px) rotate(1deg); }
        50% { transform: translate(14px, 1px) rotate(3deg); }
        75% { transform: translate(4px, 3px) rotate(0deg); }
      }
      .eye-blink {
        animation: blinkAnim 4.8s ease-in-out infinite;
        transform-origin: 480px 230px;
      }
      @keyframes blinkAnim {
        0%, 93%, 100% { transform: scaleY(1); }
        95.5% { transform: scaleY(0.08); }
      }
      .pupil-track {
        animation: pupilLook 4.8s ease-in-out infinite;
      }
      @keyframes pupilLook {
        0%, 20% { transform: translate(0px, 0px); }
        30%, 55% { transform: translate(-3px, 1px); }
        65%, 90% { transform: translate(3px, -1px); }
        100% { transform: translate(0px, 0px); }
      }
      .snout-twitch {
        animation: snoutAnim 3.8s ease-in-out infinite;
        transform-origin: 475px 260px;
      }
      @keyframes snoutAnim {
        0%, 100% { transform: translateY(0px) scale(1); }
        45% { transform: translateY(-1.2px) scale(1.02); }
        55% { transform: translateY(-1.2px) scale(0.98); }
      }
      .ear-l {
        animation: earTwitchL 4.2s ease-in-out infinite;
        transform-origin: 395px 155px;
      }
      .ear-r {
        animation: earTwitchR 4.2s ease-in-out infinite;
        transform-origin: 565px 155px;
      }
      @keyframes earTwitchL {
        0%, 85%, 100% { transform: rotate(0deg); }
        89% { transform: rotate(-5deg); }
        93% { transform: rotate(3deg); }
      }
      @keyframes earTwitchR {
        0%, 85%, 100% { transform: rotate(0deg); }
        89% { transform: rotate(6deg); }
        93% { transform: rotate(-2deg); }
      }
      .noodle-1 { animation: noodleWiggle1 3.2s ease-in-out infinite alternate; }
      .noodle-2 { animation: noodleWiggle2 2.8s ease-in-out infinite alternate; }
      .noodle-3 { animation: noodleWiggle3 3.6s ease-in-out infinite alternate; }
      @keyframes noodleWiggle1 {
        0% { transform: translate(0px, 0px) scaleY(1); }
        100% { transform: translate(-5px, 4px) scaleY(1.06); }
      }
      @keyframes noodleWiggle2 {
        0% { transform: translate(0px, 0px) scaleY(1); }
        100% { transform: translate(5px, -5px) scaleY(0.95); }
      }
      @keyframes noodleWiggle3 {
        0% { transform: translate(0px, 0px); }
        100% { transform: translate(-3px, 4px); }
      }
      .laser-stream {
        stroke-dasharray: 80 30;
        animation: laserFlow 1.8s linear infinite;
      }
      @keyframes laserFlow {
        0% { stroke-dashoffset: 220; }
        100% { stroke-dashoffset: 0; }
      }
      .laser-pulse {
        animation: beamPulse 1.6s ease-in-out infinite alternate;
      }
      @keyframes beamPulse {
        0% { opacity: 0.85; }
        100% { opacity: 1; }
      }
      .bubble-float {
        animation: bubbleFloat 2.6s ease-in-out infinite alternate;
      }
      @keyframes bubbleFloat {
        0% { transform: translateY(0px) opacity(0.6); }
        100% { transform: translateY(-6px) opacity(1); }
      }
      .mono-text { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .sans-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Card Frame -->
  <rect x="2" y="2" width="956" height="296" rx="18" fill="url(#hb-bg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Left: Content, Badges & Snippet -->
  <g transform="translate(44, 42)">
    <!-- Top Pill Badges -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="138" height="25" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="12" cy="12.5" r="4" fill="#38bdf8"/>
      <text x="24" y="16.5" class="mono-text" font-size="11" fill="#94a3b8" font-weight="600">v0.1.0 • OPEN-SOURCE</text>

      <rect x="148" y="0" width="132" height="25" rx="6" fill="#13271f" stroke="#065f46" stroke-width="1"/>
      <circle cx="160" cy="12.5" r="4" fill="#10b981"/>
      <text x="172" y="16.5" class="mono-text" font-size="11" fill="#34d399" font-weight="600">HRI: GPU_DOMINANT</text>
    </g>

    <!-- Main Headline -->
    <text x="0" y="66" class="sans-text" font-size="33" font-weight="800" fill="#ffffff" letter-spacing="-0.03em">
      Hardware Arbiter
    </text>

    <!-- Subtitle (Philosophical & Clear) -->
    <text x="0" y="98" class="sans-text" font-size="14.5" fill="#94a3b8" font-weight="400">
      O <tspan fill="#f59e0b" font-weight="700">Pandinha Pente Fino</tspan> separa o fluxo de trabalho:
    </text>
    <text x="0" y="120" class="sans-text" font-size="14" fill="#94a3b8" font-weight="400">
      Cargas pesadas vão com a GPU; a CPU fica lisa e sem nós.
    </text>

    <!-- Command Snippet Box -->
    <g transform="translate(0, 142)">
      <rect x="0" y="0" width="410" height="40" rx="8" fill="#080b13" stroke="#1e293b" stroke-width="1.5"/>
      <text x="15" y="25" class="mono-text" font-size="12.5" fill="#38bdf8">
        $ pip install -e . &amp;&amp; hardware-arbiter --apply
      </text>
    </g>

    <!-- Feature Pillars -->
    <g transform="translate(0, 206)">
      <text x="0" y="0" class="mono-text" font-size="11" fill="#64748b">
        <tspan fill="#38bdf8">✓</tspan> DirectML &amp; Vulkan   
        <tspan fill="#38bdf8" dx="16">✓</tspan> Thread-Clamping   
        <tspan fill="#38bdf8" dx="16">✓</tspan> EN / PT / ZH
      </text>
    </g>
  </g>

  <!-- Right: Backdrop Aura for Mascot -->
  <circle cx="690" cy="165" r="140" fill="url(#hb-panda-aura)"/>
  <ellipse cx="690" cy="250" rx="105" ry="16" fill="#080b13" opacity="0.8"/>

  <!-- ================= CHAOTIC ENTANGLED NOODLES (Entering from Left-Center) ================= -->
  <g id="hb-chaotic-noodles" filter="url(#cyan-glow)" stroke="#00f2fe" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path class="noodle-1" stroke-width="3.5" d="M 465 175 C 500 135, 530 205, 570 170 C 600 145, 625 185, 655 180"/>
    <path class="noodle-2" stroke-width="4" d="M 475 190 C 510 215, 535 155, 575 185 C 610 210, 630 170, 660 192"/>
    <path class="noodle-3" stroke-width="3.5" d="M 485 160 C 520 180, 545 140, 580 165 C 615 190, 635 180, 658 186"/>
    <path class="noodle-1" stroke-width="3" d="M 460 205 C 505 235, 540 195, 570 215 C 605 230, 635 200, 662 200"/>
  </g>

  <!-- Floating Sparkles on Noodle Side -->
  <g class="bubble-float" fill="#00f2fe" opacity="0.85">
    <circle cx="510" cy="155" r="2.5"/>
    <circle cx="545" cy="210" r="3"/>
    <circle cx="590" cy="148" r="2"/>
    <circle cx="620" cy="215" r="2.5"/>
    <circle cx="530" cy="180" r="3" fill="none" stroke="#00f2fe" stroke-width="1.5"/>
    <circle cx="600" cy="190" r="2.5" fill="none" stroke="#00f2fe" stroke-width="1.2"/>
  </g>

  <!-- ================= SILKY PARALLEL GPU LASERS (Shooting to Right Edge) ================= -->
  <g id="hb-organized-lasers" filter="url(#cyan-glow)">
    <line class="laser-stream laser-pulse" x1="720" y1="168" x2="956" y2="168" stroke="#00f2fe" stroke-width="4.5" stroke-linecap="round"/>
    <line class="laser-stream laser-pulse" x1="728" y1="177" x2="956" y2="177" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round"/>
    <line class="laser-stream laser-pulse" x1="732" y1="186" x2="956" y2="186" stroke="#00f2fe" stroke-width="5" stroke-linecap="round"/>
    <line class="laser-stream laser-pulse" x1="734" y1="195" x2="956" y2="195" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round"/>
    <line class="laser-stream laser-pulse" x1="730" y1="204" x2="956" y2="204" stroke="#00f2fe" stroke-width="4.5" stroke-linecap="round"/>
    <line class="laser-stream laser-pulse" x1="724" y1="213" x2="956" y2="213" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- ================= PANDINHA MASCOT (Scaled 0.65x & Centered at x=690, y=170) ================= -->
  <g transform="translate(690, 165) scale(0.66) translate(-480, -260)">
    
    <!-- Outer Sticker Halo -->
    <g stroke="#383d4f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.65">
      <circle cx="395" cy="155" r="32"/>
      <circle cx="565" cy="155" r="32"/>
      <path d="M 360 365 L 360 215 C 360 135 415 130 480 130 C 545 130 600 135 600 215 L 600 365 C 600 375 588 375 580 375 L 380 375 C 372 375 360 375 360 365 Z"/>
    </g>

    <!-- Ears Behind Body -->
    <g class="ear-l">
      <circle cx="395" cy="155" r="30" fill="url(#panda-dark)" stroke="#111218" stroke-width="7"/>
      <circle cx="395" cy="155" r="16" fill="#36333c"/>
    </g>
    <g class="ear-r">
      <circle cx="565" cy="155" r="30" fill="url(#panda-dark)" stroke="#111218" stroke-width="7"/>
      <circle cx="565" cy="155" r="16" fill="#36333c"/>
    </g>

    <!-- Main Chubby Loaf Body -->
    <g class="char-breathe">
      <path id="hb-body-base"
            d="M 365 360 L 365 220 C 365 140 415 135 480 135 C 545 135 595 140 595 220 L 595 360 C 595 372 585 372 575 372 L 385 372 C 375 372 365 372 365 360 Z" 
            fill="url(#panda-dark)" stroke="#111218" stroke-width="8" stroke-linejoin="round"/>

      <!-- Eye Patches -->
      <path d="M 366 215 C 366 160 410 160 445 190 C 475 215 470 280 435 285 C 390 290 366 265 366 215 Z" fill="url(#panda-dark)"/>
      <path d="M 594 215 C 594 160 550 160 515 190 C 485 215 490 280 525 285 C 570 290 594 265 594 215 Z" fill="url(#panda-dark)"/>

      <!-- Light Warm Cream Face & Belly -->
      <path d="M 445 180 Q 480 172 515 180 C 535 220 540 310 525 365 L 435 365 C 420 310 425 220 445 180 Z" fill="url(#panda-cream)"/>

      <!-- Navy Vest -->
      <path d="M 367 305 L 415 315 L 480 340 L 545 315 L 593 305 L 594 365 L 366 365 Z" fill="url(#panda-vest)" stroke="#111218" stroke-width="6" stroke-linejoin="round"/>
      <path d="M 480 340 L 480 365" stroke="#111218" stroke-width="4.5"/>

      <!-- Blush -->
      <ellipse cx="405" cy="265" rx="20" ry="11" fill="url(#cheek-glow)"/>
      <ellipse cx="555" cy="265" rx="20" ry="11" fill="url(#cheek-glow)"/>

      <!-- Eyes -->
      <g class="eye-blink">
        <circle cx="435" cy="235" r="23" fill="#ffffff" stroke="#111218" stroke-width="6"/>
        <circle class="pupil-track" cx="436" cy="235" r="16" fill="#111218"/>
        <circle class="pupil-track" cx="441" cy="229" r="6.5" fill="#ffffff"/>
        <circle class="pupil-track" cx="430" cy="242" r="3" fill="#ffffff"/>
      </g>
      <g class="eye-blink">
        <circle cx="525" cy="235" r="23" fill="#ffffff" stroke="#111218" stroke-width="6"/>
        <circle class="pupil-track" cx="524" cy="235" r="16" fill="#111218"/>
        <circle class="pupil-track" cx="529" cy="229" r="6.5" fill="#ffffff"/>
        <circle class="pupil-track" cx="518" cy="242" r="3" fill="#ffffff"/>
      </g>

      <!-- Snout & Mouth -->
      <g class="snout-twitch">
        <ellipse cx="480" cy="244" rx="6.5" ry="5" fill="#111218"/>
        <circle cx="478.5" cy="242.5" r="1.5" fill="#ffffff"/>
        <path d="M 480 248 L 480 254" stroke="#111218" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M 467 253 Q 474 261 480 254 Q 486 261 493 253" fill="none" stroke="#111218" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- Bottom Paws -->
      <path d="M 415 372 C 415 358 430 358 445 358 C 455 358 460 366 460 374 Z" fill="#2b2832" stroke="#111218" stroke-width="5" stroke-linejoin="round"/>
      <path d="M 500 374 C 500 366 505 358 515 358 C 530 358 545 358 545 372 Z" fill="#2b2832" stroke="#111218" stroke-width="5" stroke-linejoin="round"/>

      <!-- Arms & Comb with Combing Motion -->
      <g class="comb-motion">
        <g transform="translate(430, 260) rotate(18)">
          <rect x="0" y="0" width="115" height="24" rx="8" fill="url(#comb-amber)" stroke="#111218" stroke-width="5"/>
          <line x1="8" y1="6" x2="105" y2="6" stroke="#fef08a" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
          <g fill="url(#comb-amber)" stroke="#111218" stroke-width="3.5" stroke-linejoin="round">
            <rect x="15" y="22" width="6.5" height="30" rx="3"/>
            <rect x="27" y="22" width="6.5" height="32" rx="3"/>
            <rect x="39" y="22" width="6.5" height="33" rx="3"/>
            <rect x="51" y="22" width="6.5" height="33" rx="3"/>
            <rect x="63" y="22" width="6.5" height="33" rx="3"/>
            <rect x="75" y="22" width="6.5" height="32" rx="3"/>
            <rect x="87" y="22" width="6.5" height="30" rx="3"/>
            <rect x="99" y="22" width="6.5" height="26" rx="3"/>
          </g>
        </g>
        <!-- Left Arm -->
        <path d="M 395 295 Q 430 300 448 312 Q 440 326 420 320 Q 395 315 395 295 Z" fill="url(#panda-dark)" stroke="#111218" stroke-width="5" stroke-linejoin="round"/>
        <circle cx="440" cy="312" r="14" fill="#3a3742" stroke="#111218" stroke-width="5"/>
        <!-- Right Arm -->
        <path d="M 565 295 Q 535 305 522 322 Q 532 334 550 325 Q 570 315 565 295 Z" fill="url(#panda-dark)" stroke="#111218" stroke-width="5" stroke-linejoin="round"/>
        <circle cx="528" cy="320" r="14" fill="#3a3742" stroke="#111218" stroke-width="5"/>
      </g>
    </g>
  </g>
</svg>
